name: Release builds

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifacts: "Aria/release/Aria-Windows-*.exe"
          - os: macos-14
            artifacts: "Aria/release/Aria-MacOS-arm64-*.dmg"
          - os: ubuntu-22.04
            artifacts: |
              Aria/release/Aria-Linux-x86_64-*.AppImage
              Aria/release/Aria-Linux-x86_64-*.deb
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12"
          cache: npm
          cache-dependency-path: Aria/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-dotnet@v4
        if: runner.os == 'Windows'
        with:
          dotnet-version: "8.0.x"
      - name: Install dependencies
        working-directory: Aria
        run: |
          npm ci
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Build installers
        working-directory: Aria
        run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: aria-${{ runner.os }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Aria $GITHUB_REF_NAME" \
            --generate-notes
