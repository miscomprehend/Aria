<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self'; object-src 'none'; base-uri 'none'" />
  <link rel="icon" type="image/png" href="aria.png" />
  <title>Aria Desktop</title>
  <link rel="stylesheet" href="startup.css" />
  <script src="startup.js" defer></script>
</head>
<body>
  <div class="window-controls" aria-label="Window controls">
    <button type="button" data-window-action="minimize" aria-label="Minimize">−</button>
    <button type="button" data-window-action="close" aria-label="Close">×</button>
  </div>

  <main class="startup-shell" aria-live="polite">
    <div class="brand-lockup">
      <img src="aria.png" alt="" width="40" height="40" />
      <div>
        <strong>aria</strong>
        <span id="runtime-state">desktop · starting</span>
      </div>
    </div>

    <h1 id="startup-title">Looking for your dashboard</h1>
    <p id="startup-status" class="startup-status">Checking for an Aria dashboard...</p>

    <div class="progress-track" role="progressbar" aria-label="Starting Aria">
      <span id="startup-fill"></span>
    </div>

    <ol class="boot-steps" id="boot-steps">
      <li data-step="local" class="is-active"><i></i><span>Finding local dashboard</span><em></em></li>
      <li data-step="runtime"><i></i><span>Starting private runtime</span><em></em></li>
      <li data-step="owner"><i></i><span>Signing in as owner</span><em></em></li>
      <li data-step="open"><i></i><span>Opening dashboard</span><em></em></li>
    </ol>

    <p id="startup-elapsed" class="startup-elapsed">00:00</p>
  </main>
</body>
</html>
